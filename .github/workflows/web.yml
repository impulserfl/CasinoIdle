name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Validate & export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TARGET"
          mv templates/* "$TARGET/"
          ls "$TARGET" | head

      - name: Import project
        run: |
          godot --headless --path . --import 2>&1 | tail -40 || true
          godot --headless --path . --import 2>&1 | tail -40 || true

      - name: Boot check (main scene loads)
        run: |
          set -uo pipefail
          godot --headless --path . --quit-after 30 2>&1 | tee boot.log || true
          if grep -nE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load" boot.log; then
            echo "::error::the main scene does not load"
            exit 1
          fi
          echo "main scene loads"

      # The real gate. Runs the balance audit (every table's RTP and loss rate
      # re-derived from its own constants), checks every icon the data tables
      # name resolves to a sprite, then plays six rounds at all eighteen
      # tables. Replaces the old Python verifier, which covered four tables --
      # every table that had drifted was one it never looked at.
      - name: Balance audit, icon check and table self-test
        run: |
          set -uo pipefail
          godot --headless --path . --selftest 2>&1 | tee selftest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::selftest exited $status"
            exit 1
          fi
          if grep -nE "SCRIPT ERROR|Parse Error|Compile Error|\[FAIL\]|ICON ERROR|Nonexistent function|Invalid call|Invalid access|Invalid get index|Invalid set index|Cannot call method|Trying to assign" selftest.log; then
            echo "::error::selftest reported failures"
            exit 1
          fi
          grep -c "\[OK  \]" selftest.log | xargs echo "balance checks passed:"

      - name: Verify the save round-trip actually happened
        run: |
          set -euo pipefail
          SAVE="$HOME/.local/share/godot/app_userdata/CasinoIdle/casino_idle_save.cfg"
          if [ ! -f "$SAVE" ]; then
            echo "::error::No save file written -- the shutdown save path did not run"
            ls -R "$HOME/.local/share/godot/app_userdata" || true
            exit 1
          fi
          echo "--- $SAVE ---"
          cat "$SAVE"
          grep -q "version=2" "$SAVE" || { echo "::error::save missing version=2"; exit 1; }

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -50
          touch build/web/.nojekyll
          ls -la build/web

      - name: Verify export output
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error::build/web/$f missing or empty"
              ls -la build/web
              exit 1
            fi
          done
          echo "web build OK ($(du -sh build/web | cut -f1))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
