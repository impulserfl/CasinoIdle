name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Validate & export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TARGET"
          mv templates/* "$TARGET/"
          ls "$TARGET" | head

      # Browsers expose no system fonts, so the emoji/symbol-driven UI needs
      # bundled fallbacks or the whole game renders as tofu boxes. Sourced from
      # apt rather than a hardcoded URL (upstream font repos move paths), and
      # subset to only the ~70 codepoints this project uses so we ship a few KB
      # instead of Noto Color Emoji's ~10 MB.
      #
      # Non-fatal by design: a font problem must never block the deploy.
      - name: Build bundled fallback fonts
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p assets/fonts
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core
          python3 -m pip install --quiet fonttools

          UNI=$(python3 tools/emoji_codepoints.py)
          echo "subset target: $UNI"

          emoji_src=$(find /usr/share/fonts -iname 'NotoColorEmoji*.ttf' | head -1 || true)
          sym_src=$(find /usr/share/fonts -iname 'NotoSansSymbols2*.ttf' | head -1 || true)
          echo "emoji source:   ${emoji_src:-NONE}"
          echo "symbols source: ${sym_src:-NONE}"

          if [ -n "${emoji_src:-}" ]; then
            pyftsubset "$emoji_src" --unicodes="$UNI" \
              --output-file=assets/fonts/emoji_fallback.ttf || true
          fi
          if [ -n "${sym_src:-}" ]; then
            pyftsubset "$sym_src" --unicodes="$UNI" \
              --output-file=assets/fonts/symbols_fallback.ttf || true
          fi
          ls -la assets/fonts/ || true

      # Drop anything that came out unusable so Godot never tries to import a
      # truncated font. The game runs fine without these, just with worse glyphs.
      - name: Validate bundled fonts
        run: |
          set -uo pipefail
          shopt -s nullglob
          found=0
          for f in assets/fonts/*.ttf; do
            SZ=$(stat -c%s "$f")
            if [ "$SZ" -lt 1200 ]; then
              echo "::warning::$f is only ${SZ}b -- dropping it"
              rm -f "$f"
            else
              echo "bundling $(basename "$f") (${SZ}b)"
              found=$((found + 1))
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::No fallback fonts bundled; web build may show tofu glyphs"
          fi

      - name: Verify balance tables
        run: python3 tools/verify_balance.py

      # Two passes: the first generates .import files, the second resolves any
      # resources that only became loadable once those existed.
      - name: Import project
        run: |
          godot --headless --import 2>&1 | tail -30 || true
          godot --headless --import 2>&1 | tail -30 || true

      # GDScript compilation aborts at the first bad file, and a parse failure in
      # one script cascades into "Nonexistent function 'new'" noise everywhere it
      # is preloaded. Checking each file on its own surfaces every genuine error
      # in a single CI run instead of one per push.
      - name: Parse-check every script
        run: |
          set -uo pipefail

          # Checking a file in isolation means autoload singletons are not
          # registered yet, so every reference to one reports "Identifier not
          # found". Those are expected; anything else is a real error. The list
          # comes from project.godot so a typo'd singleton still fails.
          AUTOLOADS=$(python3 - <<'PY'
          import re, pathlib
          s = pathlib.Path('project.godot').read_text(encoding='utf-8')
          m = re.search(r'^\[autoload\]$(.*?)(?=^\[|\Z)', s, re.S | re.M)
          names = re.findall(r'^(\w+)=', m.group(1), re.M) if m else []
          print('|'.join(names) if names else '__no_autoloads__')
          PY
          )
          echo "ignoring unresolved singletons: $AUTOLOADS"

          fail=0
          while IFS= read -r f; do
            rel="res://${f#./}"
            out=$(godot --headless --check-only --script "$rel" 2>&1 || true)
            real=$(printf '%s\n' "$out" \
              | grep -E "Parse Error|Compile Error" \
              | grep -vE "Identifier not found: ($AUTOLOADS)\b" || true)
            if [ -n "$real" ]; then
              echo "::error file=${f#./}::$(printf '%s' "$real" | head -1)"
              echo "--- ${f#./} ---"
              printf '%s\n' "$out" | grep -E "Parse Error|Compile Error|at:" | head -6
              fail=1
            fi
          done < <(find . -name '*.gd' -not -path './.godot/*' | sort)
          if [ "$fail" -eq 0 ]; then echo "all scripts parse cleanly"; fi
          exit $fail

      - name: Smoke test (headless run of the real main scene)
        run: |
          set -uo pipefail
          godot --headless --quit-after 600 2>&1 | tee run.log || true
          echo "----- scanning for script errors -----"
          if grep -nE "SCRIPT ERROR|Parse Error|Nonexistent function|Invalid call|Invalid access|Invalid get index|Invalid set index|Cannot call method|Trying to assign" run.log; then
            echo "::error::Godot reported script errors during the headless run"
            exit 1
          fi
          echo "no script errors"

      - name: Verify the save round-trip actually happened
        run: |
          set -euo pipefail
          SAVE="$HOME/.local/share/godot/app_userdata/CasinoIdle/casino_idle_save.cfg"
          if [ ! -f "$SAVE" ]; then
            echo "::error::No save file written -- the shutdown save path did not run"
            ls -R "$HOME/.local/share/godot/app_userdata" || true
            exit 1
          fi
          echo "--- $SAVE ---"
          cat "$SAVE"
          grep -q "version=2" "$SAVE" || { echo "::error::save missing version=2"; exit 1; }

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -40
          touch build/web/.nojekyll
          ls -la build/web

      - name: Verify export output
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error::build/web/$f missing or empty"
              ls -la build/web
              exit 1
            fi
          done
          echo "web build OK ($(du -sh build/web | cut -f1))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
