name: Build & Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Validate & export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TARGET"
          mv templates/* "$TARGET/"
          ls "$TARGET" | head

      - name: Build bundled fallback fonts
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p assets/fonts
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core
          python3 -m pip install --quiet fonttools

          UNI=$(python3 tools/emoji_codepoints.py)
          echo "subset target: $UNI"

          emoji_src=$(find /usr/share/fonts -iname 'NotoColorEmoji*.ttf' | head -1 || true)
          sym_src=$(find /usr/share/fonts -iname 'NotoSansSymbols2*.ttf' | head -1 || true)

          if [ -n "${emoji_src:-}" ]; then
            pyftsubset "$emoji_src" --unicodes="$UNI" \
              --output-file=assets/fonts/emoji_fallback.ttf || true
          fi
          if [ -n "${sym_src:-}" ]; then
            pyftsubset "$sym_src" --unicodes="$UNI" \
              --output-file=assets/fonts/symbols_fallback.ttf || true
          fi
          ls -la assets/fonts/ || true

      - name: Validate bundled fonts
        run: |
          set -uo pipefail
          shopt -s nullglob
          found=0
          for f in assets/fonts/*.ttf; do
            SZ=$(stat -c%s "$f")
            if [ "$SZ" -lt 1200 ]; then
              echo "::warning::$f is only ${SZ}b -- dropping it"
              rm -f "$f"
            else
              echo "bundling $(basename "$f") (${SZ}b)"
              found=$((found + 1))
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::No fallback fonts bundled; web build may show tofu glyphs"
          fi

      - name: Verify balance tables
        run: python3 tools/verify_balance.py

      - name: Import project
        run: |
          godot --headless --path . --import 2>&1 | tail -40 || true
          godot --headless --path . --import 2>&1 | tail -40 || true

      # Isolation check: autoloads + global class_names are unresolved here.
      # Filter those expected messages; real syntax errors still fail the job.
      # Full correctness is enforced by the headless smoke test below.
      - name: Parse-check every script
        run: |
          set -uo pipefail

          AUTOLOADS=$(python3 - <<'PY'
          import re, pathlib
          s = pathlib.Path('project.godot').read_text(encoding='utf-8')
          m = re.search(r'^\[autoload\]$(.*?)(?=^\[|\Z)', s, re.S | re.M)
          names = re.findall(r'^(\w+)=', m.group(1), re.M) if m else []
          print('|'.join(names) if names else '__no_autoloads__')
          PY
          )
          # Global class_name scripts used across the project
          CLASSES='UIKit|Fmt|FX|Minigame'
          echo "ignoring unresolved: $AUTOLOADS | $CLASSES"

          fail=0
          while IFS= read -r f; do
            rel="res://${f#./}"
            out=$(godot --headless --path . --check-only --script "$rel" 2>&1 || true)
            real=$(printf '%s\n' "$out" \
              | grep -E "Parse Error|Compile Error" \
              | grep -vE "Identifier not found: ($AUTOLOADS|$CLASSES)\b" \
              | grep -vE "Could not find base class" \
              | grep -vE "Native class" \
              | grep -vE "Class .* not found" \
              || true)
            if [ -n "$real" ]; then
              echo "::error file=${f#./}::$(printf '%s' "$real" | head -1)"
              echo "--- ${f#./} ---"
              printf '%s\n' "$out" | grep -E "Parse Error|Compile Error|at:|Error" | head -10
              fail=1
            fi
          done < <(find . -name '*.gd' -not -path './.godot/*' | sort)
          if [ "$fail" -eq 0 ]; then echo "all scripts parse cleanly (or only expected isolation noise)"; fi
          exit $fail

      - name: Smoke test (headless run of the real main scene)
        run: |
          set -uo pipefail
          godot --headless --path . --quit-after 600 2>&1 | tee run.log || true
          echo "----- scanning for script errors -----"
          if grep -nE "SCRIPT ERROR|Parse Error|Nonexistent function|Invalid call|Invalid access|Invalid get index|Invalid set index|Cannot call method|Trying to assign" run.log; then
            echo "::error::Godot reported script errors during the headless run"
            exit 1
          fi
          echo "no script errors"

      - name: Verify the save round-trip actually happened
        run: |
          set -euo pipefail
          SAVE="$HOME/.local/share/godot/app_userdata/CasinoIdle/casino_idle_save.cfg"
          if [ ! -f "$SAVE" ]; then
            echo "::error::No save file written -- the shutdown save path did not run"
            ls -R "$HOME/.local/share/godot/app_userdata" || true
            exit 1
          fi
          echo "--- $SAVE ---"
          cat "$SAVE"
          grep -q "version=2" "$SAVE" || { echo "::error::save missing version=2"; exit 1; }

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -50
          touch build/web/.nojekyll
          ls -la build/web

      - name: Verify export output
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error::build/web/$f missing or empty"
              ls -la build/web
              exit 1
            fi
          done
          echo "web build OK ($(du -sh build/web | cut -f1))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
